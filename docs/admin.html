<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>忠生マラソン 管理</title>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --line:#e3e8ef; --ink:#1c2530; --muted:#6b7785;
  --accent:#1e5aa8; --accent-soft:#e8f0fb; --ng:#c0392b; --ok:#1f8b53;
  --radius:14px; --shadow:0 1px 2px rgba(16,32,55,.06),0 6px 20px rgba(16,32,55,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:20px;margin:12px 0 4px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-top:14px}
.card h2{margin:0 0 10px;font-size:16px}
input,select{padding:10px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--ink)}
button{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px;color:var(--ink)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.5}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted);font-size:13px}
.err{color:var(--ng);font-size:14px;margin-top:8px}
.big{display:flex;gap:18px;flex-wrap:wrap}
.big div{min-width:90px}
.big b{display:block;font-size:26px;line-height:1.2}
.tabs{display:flex;gap:6px;margin-top:16px}
.tabs button{border-radius:999px}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;white-space:nowrap}
th{background:#f8fafc;font-weight:600;position:sticky;top:0}
td.n,th.n{text-align:right}
tr.cx td{color:var(--muted);text-decoration:line-through}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.grid .card{margin-top:0}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>忠生マラソン 管理</h1>
  <div class="muted" id="mode"></div>

  <div id="login" class="card">
    <h2>合言葉</h2>
    <form class="row" id="login-f"><input type="password" id="pass" autocomplete="current-password"><button class="pri">開く</button></form>
    <div class="err" id="login-err"></div>
  </div>

  <div id="main" class="hide">
    <div class="card">
      <div class="big" id="totals"></div>
    </div>

    <div class="card">
      <h2>申込締切</h2>
      <div class="row">
        <input type="datetime-local" id="dl">
        <button class="pri" id="dl-save">保存</button>
        <button id="dl-clear">締切なしにする</button>
      </div>
      <div class="muted" id="dl-state" style="margin-top:6px"></div>
    </div>

    <div class="card">
      <h2>全員へのお知らせ</h2>
      <textarea id="nt" rows="3" style="width:100%;box-sizing:border-box;font:inherit;padding:8px" placeholder="例 雨のため中止します。"></textarea>
      <div class="row" style="margin-top:6px">
        <button class="pri" id="nt-send">載せてスマホに通知</button>
        <button id="nt-save">載せるだけ</button>
        <button id="nt-clear">消す</button>
      </div>
      <div class="muted" id="nt-state" style="margin-top:6px"></div>
    </div>

    <div class="tabs">
      <button data-tab="sum" class="on">集計</button>
      <button data-tab="list">名簿</button>
      <button id="reload" style="margin-left:auto">最新にする</button>
    </div>

    <div id="tab-sum">
      <div class="card"><h2>レース別</h2><div class="scroll" id="sum-race"></div></div>
      <h2 style="font-size:16px;margin:18px 0 0">学校・団体別</h2>
      <div class="grid" id="sum-school" style="margin-top:10px"></div>
    </div>

    <div id="tab-list" class="hide">
      <div class="card">
        <div class="row">
          <select id="f-school"><option value="">所属: すべて</option></select>
          <select id="f-race"><option value="">レース: すべて</option></select>
          <select id="f-state"><option value="申込">申込中のみ</option><option value="キャンセル">キャンセルのみ</option><option value="">すべて</option></select>
          <input type="search" id="f-q" placeholder="名前で検索">
        </div>
        <div class="row" style="margin-top:10px">
          <button id="dl-csv">CSV(表示中の名簿)</button>
          <button data-ex="xlsx:school">Excel 学校別</button>
          <button data-ex="xlsx:race">Excel レース別</button>
          <button data-ex="pdf:school">PDF 学校別</button>
          <button data-ex="pdf:race">PDF レース別</button>
        </div>
        <div class="err" id="ex-err"></div>
        <div class="muted" id="count" style="margin-top:8px"></div>
      </div>
      <div class="card scroll" style="padding:0"><table id="tbl"></table></div>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
const PK = 'marathon-admin-pass';
let pass = '', rows = [], conf = {}, notice = '', pushCount = 0;
const schoolKey = r => r['所属'].indexOf('その他') === 0 ? 'その他' : r['所属'];
const live = () => rows.filter(r => r['状態'] === '申込');

if (!API_URL) $('#mode').textContent = '試し用(この端末の中だけのデータ)。合言葉は何を入れても開きます。';
try { pass = sessionStorage.getItem(PK) || ''; } catch (e) {}

async function load(){
  const r = await api('admin_list', { pass });
  rows = r.rows; conf = r.conf; notice = conf.notice || ''; pushCount = r.pushCount || 0;
  try { sessionStorage.setItem(PK, pass); } catch (e) {}
  $('#login').classList.add('hide'); $('#main').classList.remove('hide');
  render();
}
$('#login-f').onsubmit = async e => {
  e.preventDefault(); pass = $('#pass').value;
  try { await load(); } catch (err) { $('#login-err').textContent = err.message; }
};
if (pass) load().catch(() => {});
$('#reload').onclick = () => load().catch(e => alert(e.message));

function render(){
  const L = live();
  const cnt = s => L.filter(r => r['性別'] === s).length;
  $('#totals').innerHTML = `<div><span class="muted">申込</span><b>${L.length}</b></div>
    <div><span class="muted">男子</span><b>${cnt('男子')}</b></div><div><span class="muted">女子</span><b>${cnt('女子')}</b></div>
    <div><span class="muted">キャンセル</span><b>${rows.length - L.length}</b></div>
    <div><span class="muted">家族・団体</span><b>${new Set(L.map(r => r['申込番号'])).size}</b></div>`;

  $('#dl').value = conf.deadline || '';
  $('#dl-state').textContent = conf.deadline ? (conf.open ? '受付中。締切を過ぎると申込画面は自動で閉じます。' : '締切を過ぎたので、申込画面は閉じています。') : '締切は未設定です(受付中)。';

  $('#nt').value = notice;
  $('#nt-state').textContent = (notice ? 'マイページの一番上と、LINEで「お知らせ」と送ったときに出ています。' : '今はお知らせはありません。')
    + ` 通知を受け取る端末: ${pushCount}台`;

  // レース別
  $('#sum-race').innerHTML = '<table><tr><th>レース</th><th class="n">男子</th><th class="n">女子</th><th class="n">計</th></tr>'
    + RACES.map(rc => { const x = L.filter(r => r['レース'] === rc);
        return `<tr><td>${rc}</td><td class="n">${x.filter(r => r['性別'] === '男子').length}</td><td class="n">${x.filter(r => r['性別'] === '女子').length}</td><td class="n"><b>${x.length}</b></td></tr>`; }).join('')
    + '</table>';

  // 学校・団体別 × 学年 × 性別
  $('#sum-school').innerHTML = SCHOOLS.map(s => {
    const x = L.filter(r => schoolKey(r) === s);
    if (!x.length) return '';
    const grades = GRADE_ORDER.filter(g => x.some(r => r['学年'] === g));
    return `<div class="card"><h2>${s} <span class="muted">${x.length}人</span></h2><table>
      <tr><th>学年</th><th class="n">男子</th><th class="n">女子</th><th class="n">計</th></tr>
      ${grades.map(g => { const y = x.filter(r => r['学年'] === g);
        return `<tr><td>${g}</td><td class="n">${y.filter(r => r['性別'] === '男子').length}</td><td class="n">${y.filter(r => r['性別'] === '女子').length}</td><td class="n">${y.length}</td></tr>`; }).join('')}
      </table></div>`;
  }).join('') || '<div class="muted">まだ申込はありません。</div>';

  const fs = $('#f-school'), fr = $('#f-race');
  if (fs.options.length === 1) {
    SCHOOLS.forEach(s => fs.add(new Option(s, s)));
    RACES.forEach(s => fr.add(new Option(s, s)));
  }
  renderList();
}

const COLS = ['受付コード','申込番号','申込日時','所属','氏名','フリガナ','学年','性別','レース','保護者氏名','電話','メール','状態'];
function filtered(){
  const s = $('#f-school').value, rc = $('#f-race').value, st = $('#f-state').value, q = $('#f-q').value.trim();
  const qk = toKata(q);
  return rows.filter(r => (!s || schoolKey(r) === s) && (!rc || r['レース'] === rc) && (!st || r['状態'] === st)
      && (!q || r['氏名'].includes(q) || r['フリガナ'].includes(qk) || r['保護者氏名'].includes(q)))
    .sort((a, b) => SCHOOLS.indexOf(schoolKey(a)) - SCHOOLS.indexOf(schoolKey(b))
      || GRADE_ORDER.indexOf(a['学年']) - GRADE_ORDER.indexOf(b['学年'])
      || (a['性別'] === '男子' ? 0 : 1) - (b['性別'] === '男子' ? 0 : 1) || a['フリガナ'].localeCompare(b['フリガナ'], 'ja'));
}
function renderList(){
  const x = filtered();
  $('#count').textContent = x.length + '人を表示中';
  $('#tbl').innerHTML = '<tr>' + COLS.map(c => `<th>${c}</th>`).join('') + '</tr>'
    + x.map(r => `<tr class="${r['状態'] === 'キャンセル' ? 'cx' : ''}">${COLS.map(c => `<td>${esc(r[c])}</td>`).join('')}</tr>`).join('');
}
['#f-school','#f-race','#f-state'].forEach(s => $(s).onchange = renderList);
$('#f-q').oninput = renderList;

document.querySelectorAll('.tabs [data-tab]').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs [data-tab]').forEach(x => x.classList.toggle('on', x === b));
  $('#tab-sum').classList.toggle('hide', b.dataset.tab !== 'sum');
  $('#tab-list').classList.toggle('hide', b.dataset.tab !== 'list');
});

async function saveDeadline(v){
  try { conf = await api('admin_deadline', { pass, deadline: v }); render(); }
  catch (e) { alert(e.message); }
}
$('#dl-save').onclick = () => { if ($('#dl').value) saveDeadline($('#dl').value); };
$('#dl-clear').onclick = () => saveDeadline('');

async function saveNotice(text, push){
  if (push && !confirm(`通知を受け取る${pushCount}台のスマホに送ります。よろしいですか?\n\n${text}`)) return;
  try {
    const r = await api('admin_notice', { pass, text, push });
    notice = r.notice; render();
    if (push) alert(`${r.sent}台に送りました。` + (r.gone ? `(通知をやめた${r.gone}台は宛先から外しました)` : ''));
  } catch (e) { alert(e.message); }
}
$('#nt-send').onclick = () => { const t = $('#nt').value.trim(); if (t) saveNotice(t, true); };
$('#nt-save').onclick = () => { const t = $('#nt').value.trim(); if (t) saveNotice(t, false); };
$('#nt-clear').onclick = () => { if (confirm('お知らせを消しますか?')) saveNotice('', false); };

function save(name, blob){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
$('#dl-csv').onclick = () => {
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const csv = [COLS.map(q).join(',')].concat(filtered().map(r => COLS.map(c => q(r[c])).join(','))).join('\r\n');
  const day = new Date().toISOString().slice(0, 10).replace(/-/g, '');
  save('忠生マラソン名簿_' + day + '.csv', new Blob(['﻿' + csv], { type: 'text/csv' }));   // BOM付きでExcelでも文字化けしない
};
document.querySelectorAll('[data-ex]').forEach(b => b.onclick = async () => {
  const [format, by] = b.dataset.ex.split(':'), label = b.textContent;
  $('#ex-err').textContent = ''; b.disabled = true; b.textContent = '作成中…';
  try {
    const r = await api('admin_export', { pass, format, by });
    const bin = atob(r.b64), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    save(r.name, new Blob([u], { type: r.mime }));
  } catch (e) { $('#ex-err').textContent = e.message; }
  finally { b.disabled = false; b.textContent = label; }
});
</script>
</body>
</html>
