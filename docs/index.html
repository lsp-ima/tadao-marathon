<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>忠生マラソン祭り 参加申込</title>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --line:#e3e8ef; --ink:#1c2530; --muted:#6b7785;
  --accent:#1e5aa8; --accent-soft:#e8f0fb; --ng:#c0392b; --ok:#1f8b53;
  --radius:14px; --shadow:0 1px 2px rgba(16,32,55,.06),0 6px 20px rgba(16,32,55,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
header{padding:20px 4px 8px}
header h1{margin:0;font-size:22px}
header p{margin:4px 0 0;color:var(--muted);font-size:14px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 16px;margin-top:14px}
.card h2{margin:0 0 12px;font-size:17px}
.card h2 small{font-weight:normal;color:var(--muted);font-size:13px}
label.f{display:block;margin-top:12px;font-size:14px;font-weight:600}
label.f:first-of-type{margin-top:0}
input[type=text],input[type=tel],input[type=email],select{
  width:100%;margin-top:4px;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
.seg{display:flex;gap:8px;margin-top:4px}
.seg button{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px;color:var(--ink)}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.kid{border-top:1px solid var(--line);padding-top:14px;margin-top:16px}
.kid:first-of-type{border-top:0;padding-top:0;margin-top:0}
.kid-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.kid-head b{font-size:15px}
.del{border:0;background:none;color:var(--ng);font-size:14px;padding:4px}
.race{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:600}
.add{width:100%;margin-top:16px;padding:12px;border:1.5px dashed var(--accent);border-radius:10px;background:none;color:var(--accent);font-size:16px;font-weight:600}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.agree input{width:22px;height:22px;margin:1px 0 0;flex:none}
.btn{display:block;width:100%;margin-top:18px;padding:15px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:17px;font-weight:700}
.btn.sub{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn:disabled{opacity:.5}
.err{color:var(--ng);font-size:14px;margin-top:12px;white-space:pre-line}
.hint{color:var(--muted);font-size:13px;margin-top:4px}
dl{margin:0;display:grid;grid-template-columns:7em 1fr;gap:6px 10px;font-size:15px}
dt{color:var(--muted)} dd{margin:0;word-break:break-all}
.ticket{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
.ticket .name{font-size:18px;font-weight:700}
.ticket .code{font:700 28px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.12em;margin-top:6px}
.ticket .race{display:inline-block}
.closed{text-align:center;padding:36px 16px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">忠生マラソン祭り 参加申込</h1>
    <p id="deadline"></p>
  </header>

  <div id="loading" class="card">読み込み中…</div>

  <div id="closed" class="card closed hide">
    <h2>申込の受付は終了しました</h2>
    <p class="hint">お問い合わせは実行委員会のLINEへお願いします。</p>
  </div>

  <!-- 入力 -->
  <form id="form" class="hide" novalidate>
    <div class="card">
      <h2>参加する人 <small>(兄弟姉妹はまとめて申し込めます)</small></h2>
      <div id="kids"></div>
      <button type="button" class="add" id="add">＋ 参加する人を追加</button>
    </div>

    <div class="card">
      <h2>保護者 <small>(成人の方はご本人)</small></h2>
      <label class="f">氏名<input type="text" id="g-name" autocomplete="name" placeholder="忠生 花子"></label>
      <label class="f">フリガナ<input type="text" id="g-kana" placeholder="タダオ ハナコ"></label>
      <label class="f">緊急連絡先の電話番号<input type="tel" id="g-tel" autocomplete="tel" inputmode="tel" placeholder="09012345678"></label>
      <label class="f">メールアドレス<input type="email" id="g-email" autocomplete="email" inputmode="email"></label>
    </div>

    <div class="card">
      <label class="agree"><input type="checkbox" id="agree">
        <span>入力した内容は、大会の運営(名簿・当日の受付・連絡)にだけ使います。同意して申し込みます。</span></label>
    </div>

    <div class="err" id="err"></div>
    <button class="btn" type="submit">確認へ進む</button>
  </form>

  <!-- 確認 -->
  <div id="confirm" class="hide">
    <div class="card"><h2>この内容で申し込みます</h2><div id="cf-body"></div></div>
    <div class="err" id="err2"></div>
    <button class="btn" id="send">申し込む</button>
    <button class="btn sub" id="back">戻って直す</button>
  </div>

  <!-- 完了 -->
  <div id="done" class="hide">
    <div class="card">
      <h2>申込を受け付けました</h2>
      <dl><dt>申込番号</dt><dd id="dn-group" style="font-weight:700"></dd></dl>
      <p class="hint">下のコードは当日の受付で使います。この画面をスクリーンショットで残してください。</p>
      <div id="dn-kids"></div>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
let kids = [];
let rid = '';
const blank = () => ({ school:'', schoolOther:'', name:'', kana:'', grade:'', sex:'' });

function show(id){ ['loading','closed','form','confirm','done'].forEach(x => $('#'+x).classList.toggle('hide', x !== id)); scrollTo(0,0); }

function renderKids(){
  $('#kids').innerHTML = kids.map((k, i) => {
    const adult = k.school === '成人';
    return `<div class="kid" data-i="${i}">
      <div class="kid-head"><b>${kids.length > 1 ? (i+1) + '人目' : ''}</b>${kids.length > 1 ? `<button type="button" class="del" data-del="${i}">この人を外す</button>` : ''}</div>
      <label class="f">所属
        <select data-k="school"><option value="">選んでください</option>${SCHOOLS.map(s => `<option${s === k.school ? ' selected' : ''}>${s}</option>`).join('')}</select></label>
      ${k.school === 'その他' ? `<label class="f">学校・団体名<input type="text" data-k="schoolOther" value="${esc(k.schoolOther)}"></label>` : ''}
      <label class="f">氏名<input type="text" data-k="name" value="${esc(k.name)}"></label>
      <label class="f">フリガナ<input type="text" data-k="kana" value="${esc(k.kana)}"></label>
      ${adult ? '' : `<label class="f">学年
        <select data-k="grade"><option value="">選んでください</option>${GRADES.map(g => `<option value="${g}"${g === k.grade ? ' selected' : ''}>${g.replace('小','小学').replace('中','中学')}年</option>`).join('')}</select></label>`}
      <label class="f">性別</label>
      <div class="seg">${['男子','女子'].map(s => `<button type="button" data-sex="${s}" class="${k.sex === s ? 'on' : ''}">${s}</button>`).join('')}</div>
    </div>`;
  }).join('');
}

$('#kids').addEventListener('input', e => {
  const k = e.target.dataset.k; if (!k) return;
  const i = +e.target.closest('.kid').dataset.i;
  kids[i][k] = e.target.value;
  if (e.target.tagName === 'SELECT') renderKids();
});
$('#kids').addEventListener('change', e => { if (e.target.dataset.k === 'kana') { e.target.value = toKata(e.target.value); kids[+e.target.closest('.kid').dataset.i].kana = e.target.value; } });
$('#kids').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.del != null) { kids.splice(+b.dataset.del, 1); renderKids(); return; }
  if (b.dataset.sex) { kids[+b.closest('.kid').dataset.i].sex = b.dataset.sex; renderKids(); }
});
$('#add').onclick = () => {
  const last = kids[kids.length - 1];
  kids.push(Object.assign(blank(), { school: last && last.school !== '成人' ? last.school : '', schoolOther: last ? last.schoolOther : '' }));
  renderKids();
};
$('#g-kana').addEventListener('change', e => e.target.value = toKata(e.target.value));

function guardian(){
  return { name: $('#g-name').value.trim(), kana: toKata($('#g-kana').value.trim()),
           tel: $('#g-tel').value.trim(), email: $('#g-email').value.trim() };
}
function check(){
  const g = guardian(), m = [];
  kids.forEach((k, i) => {
    const no = kids.length > 1 ? (i+1) + '人目: ' : '';
    if (!k.school) m.push(no + '所属を選んでください');
    if (k.school === 'その他' && !k.schoolOther.trim()) m.push(no + '学校・団体名を入れてください');
    if (!k.name.trim()) m.push(no + '氏名を入れてください');
    if (!/^[゠-ヿ\s　]+$/.test(toKata(k.kana.trim()))) m.push(no + 'フリガナをカタカナで入れてください');
    if (k.school !== '成人' && !k.grade) m.push(no + '学年を選んでください');
    if (!k.sex) m.push(no + '性別を選んでください');
  });
  if (!g.name) m.push('保護者の氏名を入れてください');
  if (!/^[゠-ヿ\s　]+$/.test(g.kana)) m.push('保護者のフリガナをカタカナで入れてください');
  if (!/^0\d{9,10}$/.test(g.tel.replace(/[^\d]/g, ''))) m.push('電話番号を確認してください');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(g.email)) m.push('メールアドレスを確認してください');
  if (!$('#agree').checked) m.push('同意にチェックを入れてください');
  return m;
}

$('#form').onsubmit = e => {
  e.preventDefault();
  const m = check();
  $('#err').textContent = m.join('\n');
  if (m.length) return;
  const g = guardian();
  $('#cf-body').innerHTML = kids.map(k => { const gr = k.school === '成人' ? '成人' : k.grade;
      return `<div class="ticket"><div class="name">${esc(k.name)} <small>${esc(toKata(k.kana))}</small></div>
        <div class="hint">${esc(k.school === 'その他' ? k.schoolOther : k.school)} ・ ${gr === '成人' ? '成人' : esc(gr.replace('小','小学').replace('中','中学')) + '年'} ・ ${k.sex}</div></div>`; }).join('')
    + `<dl><dt>保護者</dt><dd>${esc(g.name)}(${esc(g.kana)})</dd><dt>電話</dt><dd>${esc(g.tel)}</dd><dt>メール</dt><dd>${esc(g.email)}</dd></dl>`
    + '<p class="hint">レースの分け方・距離・スタート時刻は、申込締切のあとに2次要項でお知らせします。</p>';
  $('#err2').textContent = '';
  if (!rid) rid = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
  show('confirm');
};
$('#back').onclick = () => show('form');
$('#send').onclick = async () => {
  const b = $('#send'); b.disabled = true; b.textContent = '送信中…';
  try {
    const r = await api('apply', { rid, guardian: guardian(),
      kids: kids.map(k => ({ school: k.school, schoolOther: k.schoolOther.trim(), name: k.name.trim(), kana: toKata(k.kana.trim()), grade: k.grade, sex: k.sex })) });
    if (r.token) { location.href = 'mypage.html#t=' + r.token; return; }   // QR・案内はマイページで見せる
    $('#dn-group').textContent = r.group;
    $('#dn-kids').innerHTML = r.kids.map(k => `<div class="ticket"><div class="name">${esc(k.name)}</div><div class="code">${esc(k.code)}</div>${k.race ? `<div class="race">${esc(k.race)}</div>` : ''}</div>`).join('');
    show('done');
  } catch (err) {
    $('#err2').textContent = err.message;
  } finally { b.disabled = false; b.textContent = '申し込む'; }
};

(async () => {
  try {
    const c = await api('config');
    $('#title').textContent = c.eventName + ' 参加申込';
    if (c.deadline) { const d = new Date(c.deadline + ':00+09:00');
      $('#deadline').textContent = '申込締切 ' + d.toLocaleString('ja-JP', { month:'long', day:'numeric', weekday:'short', hour:'2-digit', minute:'2-digit' }); }
    if (!c.open) return show('closed');
    kids = [blank()]; renderKids(); show('form');
  } catch (e) { $('#loading').textContent = e.message; }
})();
</script>
</body>
</html>
